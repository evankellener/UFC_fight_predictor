<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Fighter Profile</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --muted: #8888a0;
    --accent: #d4af37;
    --red: #e74c3c;
    --blue: #3498db;
    --green: #2ecc71;
    --hover: #1a1a28;
  }
  html.light {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #e0e0e6;
    --text: #1a1a2e;
    --muted: #6b6b80;
    --accent: #b8941f;
    --hover: #eeeef2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.05em; }
  header h1 span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .back-link { font-size: 0.85rem; }
  .theme-toggle {
    background: var(--border);
    border: none;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

  .profile-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 2rem;
    align-items: flex-start;
  }

  .profile-info { flex: 1; }
  .profile-info h2 { font-size: 1.8rem; margin-bottom: 0.3rem; }
  .profile-info .country { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }

  .record-row {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
  }
  .record-item {
    text-align: center;
  }
  .record-item .num {
    font-size: 1.6rem;
    font-weight: 700;
  }
  .record-item .num.wins { color: var(--green); }
  .record-item .num.losses { color: var(--red); }
  .record-item .lbl {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.5rem;
  }
  .stat-item {
    display: flex;
    justify-content: space-between;
    padding: 0.3rem 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  .stat-item .lbl { color: var(--muted); }

  .elo-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.5rem;
    text-align: center;
    min-width: 140px;
  }
  .elo-badge .elo-val {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .elo-badge .elo-lbl {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .elo-badge .peak {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .section h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* Radar chart */
  .radar-container {
    display: flex;
    justify-content: center;
    padding: 1rem 0;
  }

  /* Recent fights */
  .fight-list { list-style: none; }
  .fight-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
  }
  .fight-item:last-child { border-bottom: none; }
  .fight-result {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
  }
  .fight-result.W { background: rgba(46,204,113,0.15); color: var(--green); }
  .fight-result.L { background: rgba(231,76,60,0.15); color: var(--red); }
  .fight-opponent { flex: 1; }
  .fight-opponent .name { font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .fight-opponent .name:hover { color: var(--accent); }
  .fight-opponent .method { font-size: 0.75rem; color: var(--muted); }
  .fight-date { font-size: 0.8rem; color: var(--muted); }

  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .profile-header { flex-direction: column; }
    .elo-badge { align-self: stretch; }
  }
</style>
</head>
<body>

<header>
  <h1><span>UFC</span> Fight Predictor</h1>
  <div class="header-right">
    <a href="/" class="back-link">Back to Predictions</a>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">M</button>
  </div>
</header>

<main>
  <div id="loading" class="loading">Loading fighter profile...</div>
  <div id="content" style="display:none;">

    <div class="profile-header">
      <div class="profile-info">
        <h2 id="fighterName"></h2>
        <div class="country" id="fighterCountry"></div>
        <div class="record-row" id="recordRow"></div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
      <div class="elo-badge" id="eloBadge" style="display:none;">
        <div class="elo-val" id="eloVal"></div>
        <div class="elo-lbl">Elo Rating</div>
        <div class="peak" id="eloPeak"></div>
      </div>
    </div>

    <div class="section">
      <h3>Skills Radar</h3>
      <div class="radar-container">
        <canvas id="radarCanvas" width="320" height="320"></canvas>
      </div>
    </div>

    <div class="section">
      <h3>Recent Fights</h3>
      <ul class="fight-list" id="fightList"></ul>
    </div>

  </div>
</main>

<script>
const JFIGHTER = '{{ jfighter }}';

// Theme
function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.documentElement.classList.add('light');
  updateThemeBtn();
}
function toggleTheme() {
  document.documentElement.classList.toggle('light');
  localStorage.setItem('theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
  updateThemeBtn();
  // Redraw radar if data exists
  if (window._radarData) drawRadar(window._radarData);
}
function updateThemeBtn() {
  const isLight = document.documentElement.classList.contains('light');
  document.getElementById('themeBtn').textContent = isLight ? 'D' : 'L';
}
initTheme();

function formatName(j) { return j.replace(/([a-z])([A-Z])/g, '$1 $2'); }

async function loadProfile() {
  try {
    const res = await fetch(`/api/fighter/${JFIGHTER}/profile`);
    if (!res.ok) {
      document.getElementById('loading').textContent = 'Fighter not found.';
      return;
    }
    const d = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('pageTitle').textContent = `${d.display_name} - UFC Fight Predictor`;

    // Name + country
    document.getElementById('fighterName').textContent = d.display_name;
    document.getElementById('fighterCountry').textContent = d.country || '';

    // Record
    const recHtml = `
      <div class="record-item"><div class="num wins">${d.wins || 0}</div><div class="lbl">Wins</div></div>
      <div class="record-item"><div class="num losses">${d.losses || 0}</div><div class="lbl">Losses</div></div>
      <div class="record-item"><div class="num">${d.ko_wins || 0}</div><div class="lbl">KO Wins</div></div>
      <div class="record-item"><div class="num">${d.sub_wins || 0}</div><div class="lbl">SUB Wins</div></div>
    `;
    document.getElementById('recordRow').innerHTML = recHtml;

    // Stats
    const stats = [];
    if (d.height) stats.push(['Height', `${d.height}"`]);
    if (d.weight) stats.push(['Weight', `${d.weight} lbs`]);
    if (d.reach) stats.push(['Reach', `${d.reach}"`]);
    if (d.stance) stats.push(['Stance', d.stance]);
    if (d.dob) stats.push(['DOB', d.dob]);
    document.getElementById('statsGrid').innerHTML = stats.map(([l,v]) =>
      `<div class="stat-item"><span class="lbl">${l}</span><span>${v}</span></div>`
    ).join('');

    // Elo
    if (d.elo) {
      document.getElementById('eloBadge').style.display = 'block';
      document.getElementById('eloVal').textContent = d.elo;
      document.getElementById('eloPeak').textContent = d.peak_elo ? `Peak: ${d.peak_elo}` : '';
    }

    // Radar
    if (d.radar && Object.keys(d.radar).length > 0) {
      window._radarData = d.radar;
      drawRadar(d.radar);
    }

    // Recent fights
    const fightHtml = (d.recent_fights || []).map(f => `
      <li class="fight-item">
        <div class="fight-result ${f.result}">${f.result}</div>
        <div class="fight-opponent">
          <div class="name" onclick="window.location='/fighter/${f.opponent}'">${f.opponent_display}</div>
          <div class="method">${f.method}${f.round ? ' R' + f.round : ''}</div>
        </div>
        <div class="fight-date">${f.date}</div>
      </li>
    `).join('');
    document.getElementById('fightList').innerHTML = fightHtml || '<li style="color:var(--muted);padding:1rem 0;">No fight history found.</li>';

  } catch (e) {
    document.getElementById('loading').textContent = 'Error loading profile.';
    console.error(e);
  }
}

function drawRadar(data) {
  const canvas = document.getElementById('radarCanvas');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const maxR = 120;
  const labels = Object.keys(data);
  const values = Object.values(data);
  const n = labels.length;
  if (n < 3) return;

  const isLight = document.documentElement.classList.contains('light');
  const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
  const textColor = isLight ? '#6b6b80' : '#8888a0';
  const fillColor = isLight ? 'rgba(184,148,31,0.2)' : 'rgba(212,175,55,0.2)';
  const strokeColor = isLight ? 'rgba(184,148,31,0.8)' : 'rgba(212,175,55,0.8)';
  const dotColor = isLight ? '#b8941f' : '#d4af37';

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid rings
  for (let ring = 1; ring <= 4; ring++) {
    const r = (ring / 4) * maxR;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axis lines
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + maxR * Math.cos(angle), cy + maxR * Math.sin(angle));
    ctx.strokeStyle = gridColor;
    ctx.stroke();
  }

  // Data polygon
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
    const r = (values[idx] / 100) * maxR;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dots + labels
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = textColor;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const r = (values[i] / 100) * maxR;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = dotColor;
    ctx.fill();

    // Label
    const lx = cx + (maxR + 18) * Math.cos(angle);
    const ly = cy + (maxR + 18) * Math.sin(angle);
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }
}

loadProfile();
</script>
</body>
</html>
