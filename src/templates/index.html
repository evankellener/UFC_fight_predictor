<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Fight Predictor</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --muted: #8888a0;
    --accent: #d4af37;
    --red: #e74c3c;
    --blue: #3498db;
    --green: #2ecc71;
    --hover: #1a1a28;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  header h1 span { color: var(--accent); }

  .status-badge {
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 12px;
    background: #1a3a1a;
    color: var(--green);
  }

  .status-badge.loading {
    background: #3a3a1a;
    color: var(--accent);
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .card-builder {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .event-info {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }

  .event-info input { flex: 1; min-width: 180px; }

  .fight-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .fight-row .bout-num {
    color: var(--muted);
    font-size: 0.8rem;
    min-width: 24px;
    text-align: right;
  }

  .fight-row input { flex: 1; }

  .fight-row .vs {
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 600;
  }

  .fight-row .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.3rem;
  }

  .fight-row .remove-btn:hover { color: var(--red); }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
    transition: border 0.2s;
  }

  input:focus { border-color: var(--accent); }

  .autocomplete-wrapper { position: relative; flex: 1; }
  .autocomplete-wrapper input { width: 100%; }

  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }

  .autocomplete-list.show { display: block; }

  .autocomplete-item {
    padding: 0.5rem 0.8rem;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .autocomplete-item:hover, .autocomplete-item.active { background: var(--hover); }

  .autocomplete-item .date {
    color: var(--muted);
    font-size: 0.75rem;
    margin-left: 0.5rem;
  }

  .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; }

  button {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #2a2a3a; }

  .results { margin-top: 1.5rem; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .result-header {
    display: flex;
    align-items: center;
    padding: 1rem 1.2rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .result-header:hover { background: var(--hover); }

  .result-header .bout-label {
    color: var(--muted);
    font-size: 0.75rem;
    min-width: 44px;
  }

  .matchup { flex: 1; display: flex; align-items: center; gap: 0.6rem; }

  .fighter-name { font-weight: 600; font-size: 0.95rem; }
  .fighter-name.winner { color: var(--accent); }
  .fighter-name.loser { color: var(--muted); }

  .matchup .vs { color: var(--muted); font-size: 0.7rem; }

  .confidence-badge {
    font-size: 0.85rem;
    font-weight: 700;
    min-width: 50px;
    text-align: right;
  }

  .prob-bar-container { display: flex; height: 4px; background: var(--border); }
  .prob-bar-a { background: var(--red); transition: width 0.5s; }
  .prob-bar-b { background: var(--blue); transition: width 0.5s; }

  .result-detail {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid var(--border);
  }

  .result-detail.show { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .detail-section h4 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .prob-comparison {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
  }

  .prob-comparison:last-child { border-bottom: none; }

  .prob-label { font-size: 0.8rem; color: var(--muted); min-width: 80px; }

  .prob-values { display: flex; gap: 2rem; font-size: 0.9rem; }
  .prob-values .a { color: var(--red); }
  .prob-values .b { color: var(--blue); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 0.3rem 0;
    font-size: 0.85rem;
  }

  .stat-row .label { color: var(--muted); }

  .driver-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.4rem 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }

  .driver-row:last-child { border-bottom: none; }
  .driver-feat { color: var(--muted); flex: 1; }

  .driver-favors {
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  .driver-favors.a { background: rgba(231,76,60,0.15); color: var(--red); }
  .driver-favors.b { background: rgba(52,152,219,0.15); color: var(--blue); }

  .error-msg { color: var(--red); font-size: 0.85rem; padding: 0.5rem 0; }

  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .event-title { text-align: center; margin-bottom: 1rem; }
  .event-title h2 { font-size: 1.2rem; color: var(--accent); }
  .event-title .date { font-size: 0.8rem; color: var(--muted); }

  @media (max-width: 600px) {
    .fight-row { flex-wrap: wrap; }
    .detail-grid { grid-template-columns: 1fr; }
    .event-info { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1><span>UFC</span> Fight Predictor</h1>
  <div id="statusBadge" class="status-badge loading">Loading model...</div>
</header>

<main>
  <div class="card-builder">
    <div class="section-title">Build Fight Card</div>
    <div class="event-info">
      <input type="text" id="eventName" placeholder="Event name (e.g. UFC 315)" value="">
      <input type="date" id="eventDate" value="">
    </div>
    <div id="fightRows"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="addFightRow()">+ Add Fight</button>
      <button class="btn-primary" id="predictBtn" onclick="predictCard()" disabled>Predict Card</button>
    </div>
  </div>
  <div id="results" class="results"></div>
</main>

<script>
const API = '';
let allFighters = [];
let fightCount = 0;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
  try {
    const res = await fetch(`${API}/api/health`);
    const data = await res.json();
    if (data.model_loaded) {
      document.getElementById('statusBadge').textContent = `Model ready (${data.fighters} fighters)`;
      document.getElementById('statusBadge').className = 'status-badge';
      document.getElementById('predictBtn').disabled = false;
    }
  } catch (e) {
    document.getElementById('statusBadge').textContent = 'Connection error';
  }
  try {
    const res = await fetch(`${API}/api/fighters`);
    allFighters = await res.json();
  } catch (e) {}
  for (let i = 0; i < 5; i++) addFightRow();
});

function addFightRow() {
  fightCount++;
  const container = document.getElementById('fightRows');
  const row = document.createElement('div');
  row.className = 'fight-row';
  row.id = `fight-${fightCount}`;
  row.innerHTML = `
    <span class="bout-num">${fightCount}.</span>
    <div class="autocomplete-wrapper">
      <input type="text" placeholder="Fighter A" data-fighter="a" data-row="${fightCount}"
             oninput="onFighterInput(this)" onfocus="onFighterInput(this)" autocomplete="off">
      <div class="autocomplete-list" id="ac-${fightCount}-a"></div>
    </div>
    <span class="vs">VS</span>
    <div class="autocomplete-wrapper">
      <input type="text" placeholder="Fighter B" data-fighter="b" data-row="${fightCount}"
             oninput="onFighterInput(this)" onfocus="onFighterInput(this)" autocomplete="off">
      <div class="autocomplete-list" id="ac-${fightCount}-b"></div>
    </div>
    <button class="remove-btn" onclick="removeFightRow(${fightCount})">&times;</button>
  `;
  container.appendChild(row);
}

function removeFightRow(id) {
  const row = document.getElementById(`fight-${id}`);
  if (row) row.remove();
}

let acTimeout = null;
function onFighterInput(input) {
  const row = input.dataset.row;
  const side = input.dataset.fighter;
  const listEl = document.getElementById(`ac-${row}-${side}`);
  const q = input.value.trim().toLowerCase();
  clearTimeout(acTimeout);
  if (q.length < 2) { listEl.classList.remove('show'); return; }
  acTimeout = setTimeout(async () => {
    try {
      const res = await fetch(`${API}/api/fighters?q=${encodeURIComponent(q)}`);
      const fighters = await res.json();
      if (fighters.length === 0) { listEl.classList.remove('show'); return; }
      listEl.innerHTML = fighters.map(f =>
        `<div class="autocomplete-item" onclick="selectFighter('${f.jfighter}', '${row}', '${side}')">
           ${formatName(f.jfighter)}
           <span class="date">${f.last_fight || ''}</span>
         </div>`
      ).join('');
      listEl.classList.add('show');
    } catch (e) {}
  }, 150);
}

function selectFighter(jfighter, row, side) {
  const input = document.querySelector(`#fight-${row} input[data-fighter="${side}"]`);
  input.value = jfighter;
  document.getElementById(`ac-${row}-${side}`).classList.remove('show');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete-wrapper'))
    document.querySelectorAll('.autocomplete-list').forEach(el => el.classList.remove('show'));
});

function formatName(jfighter) {
  return jfighter.replace(/([a-z])([A-Z])/g, '$1 $2');
}

function formatFeature(feat) {
  return feat.replace(/_diff$/, '').replace(/_dec_avg$/, '').replace(/_/g, ' ')
    .replace(/adjperf /i, 'Adj ').replace(/\b\w/g, l => l.toUpperCase());
}

async function predictCard() {
  const btn = document.getElementById('predictBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>Predicting...';
  const eventName = document.getElementById('eventName').value || 'UFC Event';
  const eventDate = document.getElementById('eventDate').value;
  const fights = [];
  document.querySelectorAll('.fight-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const a = inputs[0].value.trim();
    const b = inputs[1].value.trim();
    if (a && b) fights.push({ fighter_a: a, fighter_b: b });
  });
  if (fights.length === 0) { btn.disabled = false; btn.textContent = 'Predict Card'; return; }
  try {
    const res = await fetch(`${API}/api/predict_card`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fights, event_date: eventDate, event_name: eventName }),
    });
    const data = await res.json();
    renderResults(data);
  } catch (e) {
    document.getElementById('results').innerHTML =
      `<div class="error-msg">Failed to get predictions: ${e.message}</div>`;
  }
  btn.disabled = false;
  btn.textContent = 'Predict Card';
}

function renderResults(data) {
  const container = document.getElementById('results');
  let html = `
    <div class="event-title">
      <h2>${data.event_name}</h2>
      <div class="date">${data.event_date}</div>
    </div>
  `;
  data.predictions.forEach((p, idx) => {
    if (p.error) {
      html += `
        <div class="result-card">
          <div class="result-header">
            <span class="bout-label">#${p.bout_num}</span>
            <div class="matchup">
              <span class="fighter-name">${p.fighter_a || '?'}</span>
              <span class="vs">VS</span>
              <span class="fighter-name">${p.fighter_b || '?'}</span>
            </div>
          </div>
          <div class="error-msg" style="padding: 0.5rem 1.2rem 1rem;">${p.error}</div>
        </div>`;
      return;
    }
    const aWins = p.prob_a >= 0.5;
    const aClass = aWins ? 'winner' : 'loser';
    const bClass = aWins ? 'loser' : 'winner';
    const pctA = (p.prob_a * 100).toFixed(1);
    const pctB = (p.prob_b * 100).toFixed(1);
    const conf = (p.confidence * 100).toFixed(1);
    let vegasHtml = '';
    if (p.vegas && p.vegas.implied_prob_a != null) {
      const vA = (p.vegas.implied_prob_a * 100).toFixed(1);
      const vB = (p.vegas.implied_prob_b * 100).toFixed(1);
      const oddsA = p.vegas.odds_a > 0 ? `+${p.vegas.odds_a}` : p.vegas.odds_a;
      const oddsB = p.vegas.odds_b > 0 ? `+${p.vegas.odds_b}` : p.vegas.odds_b;
      vegasHtml = `
        <div class="prob-comparison">
          <span class="prob-label">Vegas</span>
          <div class="prob-values">
            <span class="a">${vA}% (${oddsA})</span>
            <span class="b">${vB}% (${oddsB})</span>
          </div>
        </div>`;
    }
    html += `
      <div class="result-card">
        <div class="result-header" onclick="toggleDetail(${idx})">
          <span class="bout-label">#${p.bout_num}</span>
          <div class="matchup">
            <span class="fighter-name ${aClass}">${p.display_a}</span>
            <span class="vs">VS</span>
            <span class="fighter-name ${bClass}">${p.display_b}</span>
          </div>
          <span class="confidence-badge">${conf}%</span>
        </div>
        <div class="prob-bar-container">
          <div class="prob-bar-a" style="width: ${pctA}%"></div>
          <div class="prob-bar-b" style="width: ${pctB}%"></div>
        </div>
        <div class="result-detail" id="detail-${idx}">
          <div class="detail-section" style="margin-top: 1rem;">
            <h4>Probability Comparison</h4>
            <div class="prob-comparison">
              <span class="prob-label">Our Model</span>
              <div class="prob-values">
                <span class="a">${pctA}%</span>
                <span class="b">${pctB}%</span>
              </div>
            </div>
            ${vegasHtml}
          </div>
        </div>
      </div>`;
  });
  container.innerHTML = html;
  data.predictions.forEach((p, idx) => {
    if (!p.error) fetchFightDetail(p.fighter_a, p.fighter_b, data.event_date, idx);
  });
}

async function fetchFightDetail(fighterA, fighterB, eventDate, idx) {
  try {
    const res = await fetch(`${API}/api/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fighter_a: fighterA, fighter_b: fighterB, event_date: eventDate }),
    });
    const data = await res.json();
    if (data.error) return;
    const detail = document.getElementById(`detail-${idx}`);
    if (!detail) return;
    let driversHtml = '';
    if (data.drivers && data.drivers.length > 0) {
      driversHtml = `
        <div class="detail-section" style="margin-top: 1rem;">
          <h4>Top Prediction Drivers</h4>
          ${data.drivers.map(d => {
            const sideClass = d.favors === data.fighter_a ? 'a' : 'b';
            return `<div class="driver-row">
              <span class="driver-feat">${formatFeature(d.feature)}</span>
              <span class="driver-favors ${sideClass}">${d.favors_display}</span>
            </div>`;
          }).join('')}
        </div>`;
    }
    let compareHtml = '';
    if (data.details_a && data.details_b) {
      const a = data.details_a, b = data.details_b;
      compareHtml = `
        <div class="detail-section" style="margin-top: 1rem;">
          <h4>Fighter Comparison</h4>
          <div class="detail-grid">
            <div>
              <div class="stat-row"><span class="label">Record</span> <span>${a.wins || '?'}-${a.losses || '?'}</span></div>
              <div class="stat-row"><span class="label">Height</span> <span>${a.height || '?'}</span></div>
              <div class="stat-row"><span class="label">Reach</span> <span>${a.reach || '?'}"</span></div>
              <div class="stat-row"><span class="label">Stance</span> <span>${a.stance || '?'}</span></div>
              ${a.elo ? `<div class="stat-row"><span class="label">Elo</span> <span>${a.elo}</span></div>` : ''}
              ${a.country ? `<div class="stat-row"><span class="label">Country</span> <span>${a.country}</span></div>` : ''}
            </div>
            <div>
              <div class="stat-row"><span class="label">Record</span> <span>${b.wins || '?'}-${b.losses || '?'}</span></div>
              <div class="stat-row"><span class="label">Height</span> <span>${b.height || '?'}</span></div>
              <div class="stat-row"><span class="label">Reach</span> <span>${b.reach || '?'}"</span></div>
              <div class="stat-row"><span class="label">Stance</span> <span>${b.stance || '?'}</span></div>
              ${b.elo ? `<div class="stat-row"><span class="label">Elo</span> <span>${b.elo}</span></div>` : ''}
              ${b.country ? `<div class="stat-row"><span class="label">Country</span> <span>${b.country}</span></div>` : ''}
            </div>
          </div>
        </div>`;
    }
    detail.insertAdjacentHTML('beforeend', driversHtml + compareHtml);
  } catch (e) { console.error('Failed to fetch fight detail:', e); }
}

function toggleDetail(idx) {
  const detail = document.getElementById(`detail-${idx}`);
  if (detail) detail.classList.toggle('show');
}
</script>
</body>
</html>
